<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REHAN | Intelligence Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        /* Zoom aur scrolling stability fixes */
        html, body {
            overflow-x: hidden;
            touch-action: pan-x pan-y;
            height: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e3a8a, #000000 70%);
            background-attachment: fixed;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-gradient {
            background: linear-gradient(to right, #60a5fa, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Loading Overlay Style */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scanner-container {
            position: relative;
            width: 150px;
            height: 150px;
            color: #3b82f6;
        }

        .scanner-container i {
            font-size: 150px;
            opacity: 0.2;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #60a5fa;
            box-shadow: 0 0 25px #3b82f6;
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0%; }
            50% { top: 100%; }
        }

        .blur-target.active {
            filter: blur(15px);
            pointer-events: none;
        }

        /* Full Address Visibility Fix */
        .address-box {
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            line-height: 1.5;
        }

        /* Disable auto-zoom on input focus for iOS */
        input[type="text"] {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="text-slate-200">

    <div id="loadingOverlay">
        <div class="scanner-container">
            <i class="bi bi-fingerprint"></i>
            <div class="scan-line"></div>
        </div>
        <p class="mt-8 font-mono text-blue-400 animate-pulse tracking-[0.3em] text-sm uppercase">Bypassing Encryption...</p>
    </div>

    <div id="mainContent" class="blur-target flex flex-col items-center">
        <header class="w-full max-w-md px-6 py-10 text-center">
            <h1 class="text-5xl font-extrabold tracking-tighter text-gradient mb-2">REHAN</h1>
            <p class="text-[10px] uppercase tracking-[0.5em] text-blue-400/60 font-semibold text-center">Ultimate Information Node</p>
        </header>

        <main class="w-full max-w-md px-6 pb-20">
            
            <div class="space-y-4 mb-10">
                <div class="glass rounded-2xl p-1 shadow-2xl">
                    <input type="text" id="targetInput" 
                        placeholder="Enter Number or CNIC..." 
                        class="bg-transparent w-full px-5 py-4 outline-none text-blue-100 placeholder:text-slate-500 font-medium">
                </div>
                
                <button onclick="startExecution()" id="searchBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg shadow-blue-900/40 text-white font-bold tracking-widest text-sm">
                    <i class="bi bi-fingerprint text-xl"></i> FETCH DATA
                </button>
            </div>

            <div id="resultContainer" class="hidden">
                <h2 class="text-gradient text-center font-extrabold tracking-widest text-lg mb-6 uppercase">HACKED DATA BY REHAN</h2>
                <div id="detailsBox" class="space-y-5">
                    </div>
            </div>
        </main>
    </div>

    <script>
        function startExecution() {
            const query = document.getElementById('targetInput').value;
            if (!query) return;

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('mainContent').classList.add('active');

            // 3 Second Realistic Delay
            setTimeout(() => {
                fetchData(query);
            }, 3000);
        }

        async function fetchData(query) {
            const detailsBox = document.getElementById('detailsBox');
            const resultContainer = document.getElementById('resultContainer');

            try {
                const response = await fetch(`https://sim-api.fakcloud.tech/?q=${query}`);
                const result = await response.json();

                if (result.data && result.data.records && result.data.records.length > 0) {
                    resultContainer.classList.remove('hidden');
                    detailsBox.innerHTML = "";

                    result.data.records.forEach((record) => {
                        const hasCnic = record.cnic && record.cnic.length > 5;
                        const fullAddr = record.address || 'Address not available in database.';

                        const cardHtml = `
                            <div class="glass rounded-3xl p-6 border-l-2 border-blue-500/50">
                                <div class="mb-4">
                                    <p class="text-[9px] uppercase tracking-widest text-blue-400 mb-1 font-bold">Identity Profile</p>
                                    <h3 class="text-lg font-bold text-white uppercase">${record.full_name || 'UNKNOWN'}</h3>
                                </div>

                                <div class="grid grid-cols-1 gap-3 mb-4">
                                    <div class="bg-black/40 p-3 rounded-2xl flex justify-between items-center">
                                        <span class="text-[9px] uppercase text-slate-500">Phone</span>
                                        <span class="text-sm font-mono text-blue-200">${record.phone || '---'}</span>
                                    </div>
                                    <div class="bg-black/40 p-3 rounded-2xl flex justify-between items-center">
                                        <span class="text-[9px] uppercase text-slate-500">CNIC</span>
                                        <span class="text-sm font-mono text-blue-200">${record.cnic || '---'}</span>
                                    </div>
                                </div>

                                <div class="bg-black/40 p-4 rounded-2xl mb-4 border border-white/5">
                                    <p class="text-[9px] uppercase text-slate-500 mb-2">Permanent Address (Complete)</p>
                                    <p class="text-[12px] leading-relaxed text-blue-50 address-box font-medium">
                                        ${fullAddr}
                                    </p>
                                </div>
                                
                                ${hasCnic ? `
                                <button onclick="document.getElementById('targetInput').value='${record.cnic}'; startExecution();" 
                                    class="w-full py-3 bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 text-[9px] font-bold uppercase tracking-[0.2em] rounded-xl border border-blue-500/30 transition-all">
                                    Trace Associated Records
                                </button>` : ''}
                            </div>
                        `;
                        detailsBox.innerHTML += cardHtml;
                    });
                } else {
                    alert("No records found in database.");
                }
            } catch (error) {
                alert("Connection Error.");
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('mainContent').classList.remove('active');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
